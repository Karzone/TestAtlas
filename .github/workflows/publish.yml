name: Publish

# Publishes the testatlas + testatlas-mcp NuGet packages using
# NuGet Trusted Publishing (OIDC) — no stored API key.
# Runs when a GitHub Release is published, or on demand from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for OIDC / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pack CLI
        run: dotnet pack src/CodeMap.Cli -c Release -o ./artifacts

      - name: Pack MCP
        run: dotnet pack src/CodeMap.Mcp -c Release -o ./artifacts

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: Karzone   # your NuGet.org account (the Package Owner)

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # --- List the server in the Official MCP Registry so it shows in Visual Studio's
      #     MCP Server Manager and other registry-aware clients. GitHub OIDC — no secret. ---
      - name: Wait for the package to be available on NuGet
        shell: pwsh
        run: |
          $version = ([regex]::Match((Get-Content src/Directory.Build.props -Raw), '<Version>(.*?)</Version>').Groups[1].Value).ToLowerInvariant()
          $url = "https://api.nuget.org/v3-flatcontainer/testatlas.mcp/$version/readme"
          $elapsed = 0; $interval = 10; $timeout = 300
          Write-Host "Waiting for TestAtlas.Mcp $version on NuGet ($url) ..."
          while ($true) {
            if ($elapsed -gt $timeout) { Write-Error "Package README not available after $elapsed s."; exit 1 }
            try { Invoke-WebRequest -Uri $url -ErrorAction Stop | Out-Null; Write-Host "Available."; break }
            catch { Write-Host "Not yet available ($elapsed s)..."; Start-Sleep -Seconds $interval; $elapsed += $interval }
          }

      - name: Download mcp-publisher
        run: curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz

      - name: Publish to the MCP Registry
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' src/Directory.Build.props)
          sed "s/0\.0\.0-dev/${version}/g" src/CodeMap.Mcp/.mcp/server.json > server.publish.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.publish.json
